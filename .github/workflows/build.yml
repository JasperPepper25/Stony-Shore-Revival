name: Build Forge mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17 compiler and Java 25 Gradle runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Java and build
        run: |
          java -version
          gradle --version
          gradle clean build --stacktrace
      - name: Upload installable Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: stony-shore-revival-forge-1.20.1
          path: build/libs/*-srg.jar
          if-no-files-found: error
